## 35.7 최소 자유소득 / Safety Buffer

대출 실행 후 생활가능성의 최소 안전선을 관리한다.

관리 후보:

```text
minimum_free_income
minimum_free_income_ratio
safety_buffer_amount
safety_buffer_ratio
```

정확한 초기값은 경제 progression 시뮬레이션으로 확정한다.

## 35.8 필수지출 예약

`reserved_mandatory_expenses`에 포함할 항목과 기준값을 관리한다.

기본 대상:

- 다음 월세
- 관리비
- 기본 생활비
- 보험/기타 고정비
- 전세대출 월이자
- 주담대 월상환액
- 이미 확정된 기타 필수 자동지출

관리 구조 후보:

```text
mandatory_expense_type
reservation_enabled
calculation_profile_id
priority
is_active
```

예약/합산 처리 엔진 자체는 코드다.

## 35.9 Spendable Cash 표시/임계값

계산식:

```text
spendable_cash
= cash_balance - reserved_mandatory_expenses
```

계산 자체는 코드다.

어드민 관리 대상:

- UI에 `보유현금`과 `사용 가능 현금`을 함께 표시할지 여부
- 부족액 CTA 노출 임계값
- 낮은 사용가능현금 경고 임계값
- 경고/안내 문구

관리 필드 후보:

```text
show_cash_balance
show_spendable_cash
low_spendable_cash_threshold
shortage_cta_threshold
warning_copy
```

