name: One-time loan policy sync

on:
  push:
    paths:
      - .github/workflows/loan-policy-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch planning documents
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          # 00_master_policy.md — replace only the loan section.
          p = '00_master_policy.md'
          s = read(p)
          pattern = r'# 16\. 대출\n.*?\n---\n\n# 17\. 이벤트'
          replacement = '''# 16. 대출

대출은 `미래의 가처분소득을 당겨 쓰는 수단`으로 정의한다.

MVP 대출상품:
- `JEONSE_LOAN`
- `HOME_LOAN`

전세대출:
- 계약 중 월 이자만 납부
- 계약 종료 시 반환된 보증금에서 대출원금 자동 정산

주택담보대출:
- 매월 원금 + 이자 상환
- 기존 60~120개월 단축안은 사용하지 않음
- MVP 기본 만기는 30년 고정을 우선
- 일부상환/전액상환 가능
- MVP 중도상환수수료 없음

대출한도는 단순 주택가격 비율이 아니라 다음 두 조건을 모두 본다.

```text
최대대출
= min(property_based_limit, affordability_based_limit)
```

상환능력 계산에는 기본 생활비, 주거 고정비, 보험/기타 고정비와 기존 대출상환액을 포함한다.

또한 실제 보유현금과 자유롭게 쓸 수 있는 현금을 분리한다.

```text
spendable_cash
= cash_balance - reserved_mandatory_expenses
```

다음 월세, 관리비, 기본 생활비, 보험/고정비, 대출상환 등 필수지출은 먼저 예약하고 가구·인테리어·투자·일반 소비는 `spendable_cash` 범위 안에서만 가능하게 한다.

이직 시에도 기존 대출상환을 포함한 생활 가능 여부를 검사한다. 연봉이 낮아지는 이직 자체를 금지하지 않되 상환 후 최소 자유소득 안전선을 충족하지 못하면 이직 실행을 제한한다.

일반 플레이에서는 대출실행·소비·이직 단계의 사전검증으로 연체/압류/파산/강제경매 상태가 생기지 않게 한다. 실직 시 기존 대출을 즉시 회수하거나 강제매도하지 않는다.

집 매도 시 기존 주담대는 매도대금에서 자동정산하고 종료하며 대출 승계는 하지 않는다. 새 집에는 새 대출을 실행한다.

세부 정책은 `11_loan.md`, 운영값은 `15_admin.md`를 기준으로 한다.

---

# 17. 이벤트'''
